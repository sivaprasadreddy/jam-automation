<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <div class="flex flex-col gap-6 md:min-h-[calc(100vh-7rem)] md:flex-row">
        <aside class="w-full shrink-0 md:w-60">
            <nav class="md:h-full rounded-lg border border-slate-200 bg-white p-3 shadow-sm" aria-label="Dashboard navigation">
                <ul class="space-y-1">
                    <li>
                        <a th:href="@{/home}"
                           th:classappend="${activeMenu == 'dashboard'} ? 'bg-sky-50 text-sky-700' : 'text-slate-700 hover:bg-slate-100'"
                           class="flex items-center rounded-md px-3 py-2 text-sm font-medium">
                            <i class="fas fa-tachometer-alt mr-3 w-4" aria-hidden="true"></i> Dashboard
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>
        <main class="min-w-0 flex-1 rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
            <div layout:fragment="dashboard-content">
                <!-- Dashboard page content -->
            </div>
        </main>
    </div>
</div>
</body>
</html>
